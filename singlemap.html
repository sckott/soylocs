<!DOCTYPE html>
<html>
<head>
<meta charset=utf-8 />
<title>f*ing soy!</title>
<meta name="viewport"" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
<!-- <script src="https://api.tiles.mapbox.com/mapbox.js/v3.1.1/mapbox.js"></script>
<link href="https://api.tiles.mapbox.com/mapbox.js/v3.1.1/mapbox.css" rel="stylesheet" /> -->
<script src='https://api.mapbox.com/mapbox.js/v3.3.1/mapbox.js'></script>
<link href='https://api.mapbox.com/mapbox.js/v3.3.1/mapbox.css' rel='stylesheet' />
<link rel="shortcut icon" href="favicon-bullhorn.ico">
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.4.0/css/font-awesome.min.css">
<style>
body { margin:0; padding:0; }
#map { position:absolute; top:0; bottom:0; width:100%; }
  /* Popup styles */
  .popup-wrapper {
    font-family: inherit;
    min-width: 220px;
    max-width: 280px;
  }
  .popup-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .popup-name {
    font-size: 15px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.3;
    margin: 0;
  }
  .popup-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .popup-badge.nosoy {
    background: #e8f8ef;
    color: #1a7a40;
    border: 1px solid #a8e0be;
  }
  .popup-badge.soy {
    background: #f0f4ff;
    color: #3a5ab0;
    border: 1px solid #b8c8f0;
  }
  .popup-badge.closed {
    background: #f5f5f5;
    color: #888;
    border: 1px solid #ddd;
  }
  .popup-notes {
    font-size: 12.5px;
    color: #555;
    line-height: 1.5;
    margin: 0 0 10px 0;
    padding-bottom: 10px;
    border-bottom: 1px solid #eee;
  }
  .popup-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
  }
  .popup-action-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: #555;
    text-decoration: none;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid #e0e0e0;
    background: #fafafa;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
    line-height: 1.4;
  }
  .popup-action-btn:hover {
    background: #f0f0f0;
    border-color: #ccc;
    color: #222;
  }
  .popup-action-btn i {
    font-size: 11px;
    width: 11px;
    text-align: center;
  }
  .popup-action-sep {
    flex: 1;
  }
  .popup-report-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    color: #ccc;
    text-decoration: none;
    padding: 4px 2px 4px 6px;
    border-radius: 4px;
    transition: color 0.15s, background 0.15s;
    flex-shrink: 0;
  }
  .popup-report-btn:hover {
    color: #e05555;
    background: #fff0f0;
  }
  /* Override Leaflet popup chrome to be cleaner */
  .leaflet-popup-content-wrapper {
    border-radius: 8px !important;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15) !important;
    padding: 0 !important;
  }
  .leaflet-popup-content {
    margin: 14px 16px !important;
  }
  .leaflet-popup-tip-container {
    margin-top: -1px;
  }

  .ui-panel {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 120px;
  }
  .menu-ui {
    background:#fff;
    border-radius:3px;
    width:100%;
    border:1px solid rgba(0,0,0,0.4);
    }
  .menu-ui a {
    font-size:13px;
    color:#404040;
    display:block;
    margin:0;padding:0;
    padding:10px;
    text-decoration:none;
    border-bottom:1px solid rgba(0,0,0,0.25);
    text-align:center;
  }
  .menu-ui a:first-child {
    border-radius:3px 3px 0 0;
    }
  .menu-ui a:last-child {
    border:none;
    border-radius:0 0 3px 3px;
    }
  .menu-ui a:hover {
    background:#f8f8f8;
    color:#404040;
    }
  .menu-ui a.active,
  .menu-ui a.active:hover {
    background:#3887BE;
    color:#FFF;
    }
  /* Remove rounded bottom from last <a> since toggle row follows */
  .menu-ui a:last-of-type {
    border-radius: 0;
  }
  .menu-ui-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 10px;
    font-size: 13px;
    color: #404040;
    cursor: pointer;
    border-top: 1px solid rgba(0,0,0,0.25);
    border-radius: 0 0 3px 3px;
    user-select: none;
  }
  .menu-ui-toggle:hover {
    background: #f8f8f8;
  }
  .toggle-switch {
    position: relative;
    width: 28px;
    height: 16px;
    flex-shrink: 0;
  }
  .toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
    position: absolute;
  }
  .toggle-track {
    position: absolute;
    inset: 0;
    background: #ccc;
    border-radius: 16px;
    transition: background 0.2s;
    cursor: pointer;
  }
  .toggle-track::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    top: 2px;
    left: 2px;
    transition: transform 0.2s;
  }
  .toggle-switch input:checked + .toggle-track {
    background: #3887BE;
  }
  .toggle-switch input:checked + .toggle-track::after {
    transform: translateX(12px);
  }
  #result-count {
    display: block;
    text-align: center;
    font-size: 11px;
    color: #888;
    padding: 5px 10px 6px;
    border-top: 1px solid rgba(0,0,0,0.12);
    letter-spacing: 0.01em;
  }
  .search-ui-wrapper {
    width: 120px;
    align-self: flex-end;
    background: #fff;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    padding: 0 8px;
    box-sizing: border-box;
    transition: border-color 0.2s, box-shadow 0.2s, width 0.25s ease;
  }
  .search-ui-wrapper:focus-within {
    border-color: #3887BE;
    box-shadow: 0 0 0 2px rgba(56,135,190,0.2);
    width: 180px;
    margin-left: -60px;
  }
  .search-ui-wrapper svg {
    flex-shrink: 0;
    color: #999;
    width: 13px;
    height: 13px;
    margin-right: 6px;
    transition: color 0.2s;
  }
  .search-ui-wrapper:focus-within svg {
    color: #3887BE;
  }
  #search {
    border: none;
    outline: none;
    font-size: 13px;
    color: #404040;
    background: transparent;
    width: 100%;
    padding: 10px 0;
    font-family: inherit;
  }
  #search::placeholder {
    color: #aaa;
  }
  #clear-search {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    color: #bbb;
    font-size: 14px;
    line-height: 1;
    flex-shrink: 0;
    transition: color 0.15s;
  }
  #clear-search:hover {
    color: #404040;
  }

</style>

<script src='https://code.jquery.com/jquery-1.11.0.min.js'></script>

<div id="map"></div>

<div class='ui-panel'>
  <nav class='menu-ui'>
    <a href='#' class='active' data-filter='all'>Show all</a>
    <a href='#' data-filter='nosoy'>No Soy</a>
    <label class='menu-ui-toggle' for='hide-closed-toggle'>
      Hide closed
      <span class='toggle-switch'>
        <input type='checkbox' id='hide-closed-toggle' />
        <span class='toggle-track'></span>
      </span>
    </label>
    <span id='result-count'></span>
  </nav>

  <div class="search-ui-wrapper">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id='search' placeholder='Search…' autocomplete="off" />
    <button id="clear-search" title="Clear">&#x2715;</button>
  </div>
</div>

  <script>
    L.mapbox.accessToken = 'pk.eyJ1IjoicmVjb2xvZ3kiLCJhIjoiZWlta1B0WSJ9.u4w33vy6kkbvmPyGnObw7A';
      var map = L.mapbox.map("map", "mapbox.streets")
      .setView([45.53, -122.62], 12);

    var geojson = [
      {{#places}}
      {
        type: "Feature",
          "geometry": { "type": "Point", "coordinates": [ {{long}}, {{lat}} ]},
          "properties": {
              "place": "{{place}}",
              "marker-symbol": "{{marker_symbol}}",
              "marker-color": "{{marker_color}}",
              "nosoy": {{nosoy}},
              "url": "{{url}}",
              "menu": "{{menu}}",
              "notes": "{{notes}}"
          }
      },
      {{/places}}
    ];

    $('#search').on('input', function() {
      $('#clear-search').css('display', $(this).val() ? 'block' : 'none');
      search();
    });

    $('#clear-search').on('click', function() {
      $('#search').val('').trigger('input').focus();
    });

    function bindPopup(marker) {
      var p = marker.feature.properties;
      var isClosed = (p.notes || '').toUpperCase().indexOf('CLOSED') !== -1
                     || (p['marker-symbol'] || '') === 'danger';

      // Badge
      var badgeHtml;
      if (isClosed) {
        badgeHtml = '<span class="popup-badge closed">Closed</span>';
      } else if (p.nosoy) {
        badgeHtml = '<span class="popup-badge nosoy">&#10003; Soy-free</span>';
      } else {
        badgeHtml = '<span class="popup-badge soy">Contains soy</span>';
      }

      // Notes (hide if null/empty)
      var notesHtml = '';
      if (p.notes && p.notes !== 'null' && p.notes !== '') {
        notesHtml = '<p class="popup-notes">' + p.notes + '</p>';
      }

      // Links — deduplicate url/menu
      var hasUrl  = p.url  && p.url  !== 'null' && p.url  !== '';
      var hasMenu = p.menu && p.menu !== 'null' && p.menu !== '' && p.menu !== p.url;

      var linksHtml = '';
      if (hasUrl) {
        linksHtml += '<a href="' + p.url + '" target="_blank" class="popup-action-btn">'
                   + '<i class="fa fa-home"></i> Website</a>';
      }
      if (hasMenu) {
        linksHtml += '<a href="' + p.menu + '" target="_blank" class="popup-action-btn">'
                   + '<i class="fa fa-list"></i> Menu</a>';
      }

      var popupContent =
        '<div class="popup-wrapper">' +
          '<div class="popup-header">' +
            '<h3 class="popup-name">' + p.place + '</h3>' +
            badgeHtml +
          '</div>' +
          notesHtml +
          '<div class="popup-actions">' +
            linksHtml +
            '<span class="popup-action-sep"></span>' +
            '<a href="https://github.com/sckott/soylocs/issues/new" target="_blank" class="popup-report-btn" title="Report an issue">' +
              '<i class="fa fa-bug"></i>' +
            '</a>' +
          '</div>' +
        '</div>';

      marker.bindPopup(popupContent, {
        closeButton: true,
        minWidth: 220,
        maxWidth: 280
      });
    }

    var markers = L.mapbox.featureLayer()
      .setGeoJSON(geojson)
      .addTo(map);

    markers.eachLayer(bindPopup);

    markers.on("layeradd", function(e) {
      bindPopup(e.layer);
    });

    var currentFilter = 'all';
    var hideClosed = false;

    function isClosedPlace(f) {
      var notes = (f.properties.notes || '').toUpperCase();
      var symbol = f.properties['marker-symbol'] || '';
      return notes.indexOf('CLOSED') !== -1 || symbol === 'danger';
    }

    function applyFilters() {
      var searchString = $('#search').val().toLowerCase();
      markers.setFilter(function(f) {
        if (hideClosed && isClosedPlace(f)) return false;
        if (currentFilter === 'nosoy' && !f.properties.nosoy) return false;
        if (searchString && f.properties.place.toLowerCase().indexOf(searchString) === -1) return false;
        return true;
      });
      // update result count
      var count = 0;
      markers.eachLayer(function() { count++; });
      var total = geojson.length;
      $('#result-count').text(count === total ? count + ' places' : count + ' of ' + total + ' places');
    }

    applyFilters();

    $('.menu-ui a').on('click', function() {
      currentFilter = $(this).data('filter');
      $(this).addClass('active').siblings().removeClass('active');
      applyFilters();
      return false;
    });

    $('#hide-closed-toggle').on('change', function() {
      hideClosed = $(this).is(':checked');
      applyFilters();
    });

    function search() {
      applyFilters();
    }
  </script>

</body>
</html>
